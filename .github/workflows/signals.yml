name: Crypto Signals

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram openai requests pandas pandas_ta ccxt python-dotenv

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python crypto_signal_bot.py

      - name: Commit and push state files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add signals_state.json || true
          git add -f last_status.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state files" && git push)