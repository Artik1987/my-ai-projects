        body {

            background-color: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        /* Переключатель языка */
        .lang-switch {
            text-align: right;
            margin-bottom: 20px;
        }
        .lang-switch button {
            background: #fff;
            border: 1px solid #d2d2d7;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .lang-switch button:hover {
            background: #e8e8ed;
        }
        /* Шапка */
        header {
            text-align: center;
            margin-bottom: 60px;
        }
        header h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        header p {
            font-size: 20px;
            color: #86868b;
            max-width: 600px;
            margin: 0 auto;
        }
        /* Секции */
        section {
            margin-bottom: 50px;
        }
        h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        /* Карточки проектов */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 600;
        }
        .card p {
            color: #515154;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .card a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
        }
        .card a:hover {
            text-decoration: underline;
        }
        /* Блок ссылок (Биржи) */
        .links-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn-link {
            background: #fff;
            border: 1px solid #d2d2d7;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            color: #1d1d1f;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-link:hover {
            background: #1d1d1f;

        }
        /* Форма связи */

            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);

        }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
        }
        .contact-form button {
            background: #0071e3;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .contact-form button:hover {

        }
        footer {

            color: #86868b;
            font-size: 14px;

            border-top: 1px solid #d2d2d7;

    function setLang(lang) {
        document.querySelectorAll('[data-ru]').forEach(el => {
            el.textContent = el.getAttribute('data-' + lang);
        });
    }
